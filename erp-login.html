<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دخول Bariq ERP</title>
<link rel="icon" href="/assets/icon.png">
<style>
:root{--navy:#152546;--navy2:#274d82;--line:#e2e8f2;--muted:#7b8498;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;font-family:Tahoma,Arial,sans-serif;color:var(--navy);background:radial-gradient(circle at 15% 10%,#eaf1ff,transparent 32%),radial-gradient(circle at 85% 12%,#e7fbf5,transparent 30%),var(--bg);padding:18px}.login{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px rgba(21,37,70,.12);padding:28px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand img{width:54px;height:54px;border-radius:16px}.brand b{display:block;font-size:1.15rem}.brand small{color:var(--muted)}label{display:block;margin:12px 0 6px;font-size:.8rem;font-weight:800;color:#626d82}input{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;outline:none}input:focus{border-color:#274d82;box-shadow:0 0 0 4px rgba(39,77,130,.08)}button{width:100%;height:50px;border:0;border-radius:14px;margin-top:18px;color:#fff;font:inherit;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#2b5287,#19365f 52%,#102542);box-shadow:0 10px 22px rgba(16,37,66,.18)}button:disabled{opacity:.6;cursor:wait}.msg{display:none;margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#fff3f3;color:#a12d2d;font-size:.78rem}.msg.show{display:block}.foot{margin-top:16px;text-align:center;color:var(--muted);font-size:.72rem}
</style>
<script src="/java/supabase.js?v=20260818-v2" defer></script>
</head>
<body>
<form class="login" id="erpLoginForm">
  <div class="brand"><img src="/assets/icon.png" alt=""><span><b>Bariq ERP</b><small>تسجيل دخول نظام الإدارة</small></span></div>
  <label>البريد الإلكتروني</label><input id="erpEmail" type="email" autocomplete="username" required>
  <label>كلمة المرور</label><input id="erpPassword" type="password" autocomplete="current-password" required>
  <div class="msg" id="erpLoginMsg"></div>
  <button id="erpLoginBtn" type="submit">دخول النظام</button>
  <div class="foot">الدخول متاح فقط للمالك أو المحاسب المفعّل في ERP.</div>
</form>
<script>
(function(){
 const form=document.getElementById('erpLoginForm'),btn=document.getElementById('erpLoginBtn'),msg=document.getElementById('erpLoginMsg');
 const show=(t)=>{msg.textContent=t;msg.classList.toggle('show',!!t)};
 const clear=()=>{['admin_ok','admin_token','admin_refresh_token','admin_token_exp','admin_name'].forEach(k=>sessionStorage.removeItem(k));localStorage.removeItem('bariq_admin_auth_v1')};
 function wait(){return new Promise((resolve,reject)=>{let n=0;const x=setInterval(()=>{if(window.Supabase?.Auth?.signIn&&window.sbFetch){clearInterval(x);resolve()}else if(++n>60){clearInterval(x);reject(new Error('تعذر تحميل Supabase'))}},100)})}
 form.addEventListener('submit',async(e)=>{e.preventDefault();show('');btn.disabled=true;btn.textContent='جارٍ تسجيل الدخول...';try{await wait();clear();const email=document.getElementById('erpEmail').value.trim(),password=document.getElementById('erpPassword').value;const auth=await window.Supabase.Auth.signIn(email,password);if(!auth?.access_token||!auth?.user?.id)throw new Error('بيانات الدخول غير صحيحة');sessionStorage.setItem('admin_ok','1');sessionStorage.setItem('admin_token',auth.access_token);sessionStorage.setItem('admin_refresh_token',auth.refresh_token||'');sessionStorage.setItem('admin_token_exp',String(Date.now()+Number(auth.expires_in||3600)*1000));const rows=await window.sbFetch('erp_users?user_id=eq.'+encodeURIComponent(auth.user.id)+'&active=eq.true&select=user_id,full_name,role,active&limit=1',{requireAuth:true});const u=Array.isArray(rows)?rows[0]:null;if(!u||!['owner','accountant','admin'].includes(String(u.role||'').toLowerCase()))throw new Error('هذا الحساب غير مصرح له بدخول ERP');const name=u.full_name||email.split('@')[0];sessionStorage.setItem('admin_name',name);localStorage.setItem('bariq_admin_auth_v1',JSON.stringify({ok:true,access:auth.access_token,refresh:auth.refresh_token||'',expires:Date.now()+Number(auth.expires_in||3600)*1000,name}));const q=new URLSearchParams(location.search);let ret=q.get('return')||'/erp';if(!ret.startsWith('/'))ret='/erp';location.replace(ret)}catch(err){clear();show(err?.message||'تعذر تسجيل الدخول');btn.disabled=false;btn.textContent='دخول النظام'}});
 const q=new URLSearchParams(location.search);if(q.get('error')==='forbidden')show('الحساب غير مصرح له بدخول نظام ERP أو تم إيقافه.');
})();
</script>
</body></html>
