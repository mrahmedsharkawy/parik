<head>
  
<script src="/java/trusted-types.js?v=20260803a"></script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#152546">
  <title>عروض الشهر - بريق</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/icon-96.png?v=site-icon-20260727">
  <link rel="stylesheet" href="/style/style.css?v=142">
  <link rel="stylesheet" href="/mobile-nav-bar/styles.css?v=apple-liquid-20260803-cartpos" media="(max-width: 899px)">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6f8;font-family:Arial,Tahoma,sans-serif;color:#152546;padding-bottom:calc(65px + env(safe-area-inset-bottom))}
    .monthly-header{position:sticky;top:0;z-index:1000;background:#152546;color:#fff;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.16)}
    .monthly-header-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .monthly-brand{color:#fff;text-decoration:none;font-size:1.28rem;font-weight:900;line-height:1;white-space:nowrap}
    .monthly-back{color:#fff;text-decoration:none;font-size:.86rem;font-weight:800;opacity:.92}
    .monthly-main{width:min(1180px,94%);margin:14px auto 46px}
    .monthly-hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#fff7dc 0%,#f0cf61 46%,#152546 145%);padding:18px 16px 16px;box-shadow:0 10px 28px rgba(21,37,70,.14)}
    .monthly-hero::after{content:'';position:absolute;inset:auto -30px -46px auto;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.24)}
    .monthly-kicker{display:inline-flex;align-items:center;gap:7px;min-height:28px;border-radius:999px;background:rgba(21,37,70,.1);padding:5px 10px;font-size:.8rem;font-weight:900;color:#152546}
    .monthly-title{margin:10px 0 5px;font-size:1.5rem;font-weight:900;line-height:1.2;color:#152546}
    .monthly-sub{margin:0;font-size:.88rem;font-weight:700;color:rgba(21,37,70,.72);line-height:1.7}
    .monthly-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .monthly-stat{display:inline-flex;align-items:center;justify-content:center;min-height:30px;border-radius:999px;background:#152546;color:#fff;padding:6px 11px;font-size:.78rem;font-weight:900}
    .monthly-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}
    .monthly-search{flex:1;min-width:0;height:38px;border:1px solid #dde2ea;border-radius:12px;background:#fff;padding:0 12px;font-size:.92rem;font-weight:700;color:#152546;outline:none}
    .monthly-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .monthly-card{position:relative;min-width:0;background:#fff;border:1px solid #edf0f4;border-radius:14px;overflow:hidden;box-shadow:0 5px 16px rgba(21,37,70,.07);display:flex;flex-direction:column}
    .monthly-card a{color:inherit;text-decoration:none;display:block}
    .monthly-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eef1f5;display:block}
    .monthly-badge{position:absolute;top:8px;right:8px;z-index:2;display:inline-flex;align-items:center;justify-content:center;min-height:27px;border-radius:999px;background:linear-gradient(180deg,#e43f2f,#b91225);color:#fff;padding:5px 9px;font-size:.74rem;font-weight:900;box-shadow:0 6px 15px rgba(185,18,37,.25)}
    .monthly-body{padding:8px 9px 10px;display:flex;flex-direction:column;gap:6px;min-height:116px}
    .monthly-name{font-size:.84rem;font-weight:900;line-height:1.35;color:#172541;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
    .monthly-price-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .monthly-price{font-size:.92rem;font-weight:900;color:#b91225}
    .monthly-old{font-size:.74rem;font-weight:800;color:#8b93a2;text-decoration:line-through}
    .monthly-save{display:inline-flex;align-items:center;align-self:flex-start;border-radius:999px;background:#fff5d2;color:#7a5a00;padding:4px 8px;font-size:.68rem;font-weight:900}
    .monthly-empty{grid-column:1/-1;text-align:center;background:#fff;border-radius:16px;padding:28px 14px;font-weight:900;color:#667085}
    .mobile-nav{display:none}
    @media(max-width:899px){
      .monthly-header{position:fixed;left:0;right:0;top:0;padding:7px 11px;z-index:10000}
      .monthly-header-inner{min-height:40px}
      .monthly-brand{font-size:1.36rem}
      .monthly-main{width:96%;margin:66px auto 46px}
      .monthly-hero{padding:15px 13px 14px;border-radius:16px}
      .monthly-title{font-size:1.32rem}
      .monthly-sub{font-size:.82rem}
      .monthly-controls{margin-top:10px}
      .mobile-nav{display:block}
    }
  </style>
</head>
<body>
  <nav class="mobile-nav" role="navigation" aria-label="التنقل أسفل الشاشة">
    <ul>
      <li><a href="/" class="nav-link" data-key="home"><img src="/mobile-nav-bar/icons/home.svg" class="icon" alt="" aria-hidden="true" width="25" height="25"><span data-i18n="الرئيسية">الرئيسية</span></a></li>
      <li><a href="/categories" class="nav-link" data-key="categories"><img src="/mobile-nav-bar/icons/categories.svg" class="icon" alt="" aria-hidden="true" width="25" height="25"><span data-i18n="المناسبات">المناسبات</span></a></li>
      <li class="fire-deal-item"><a href="/offers" class="nav-link fire-deal-link" data-key="offers"><span class="fire-nav-icon">🔥</span><span data-i18n="عروض">عروض</span></a></li>
      <li><a href="/account" class="nav-link" data-key="account"><span class="icon-wrap account-badge" data-count="0"><img src="/mobile-nav-bar/icons/account.svg" class="icon" alt="" aria-hidden="true" width="25" height="25"></span><span data-i18n="حسابي">حسابي</span></a></li>
      <li><a href="/Cart" class="nav-link" data-key="cart"><span class="icon-wrap cart-badge" data-count="0"><img src="/mobile-nav-bar/icons/cart.svg" class="icon" alt="" aria-hidden="true" width="25" height="25"></span><span data-i18n="السلة">السلة</span></a></li>
    </ul>
  </nav>

  <header class="monthly-header">
    <div class="monthly-header-inner">
      <a href="/" class="monthly-brand">Bariq</a>
      <a href="/" class="monthly-back" data-i18n="العودة للرئيسية">العودة للرئيسية</a>
    </div>
  </header>

  <main class="monthly-main">
    <section class="monthly-hero" aria-label="عروض الشهر" data-i18n-aria-label="عروض الشهر">
      <span class="monthly-kicker" data-i18n="🎁 خصومات عالية">🎁 خصومات عالية</span>
      <h1 class="monthly-title" data-i18n="عروض الشهر">عروض الشهر</h1>
      <p class="monthly-sub" data-i18n="منتجات مختارة عليها أعلى نسب خصم متاحة الآن.">منتجات مختارة عليها أعلى نسب خصم متاحة الآن.</p>
      <div class="monthly-stats">
        <span class="monthly-stat" id="monthlyCount">-- منتج</span>
        <span class="monthly-stat" id="monthlyMaxDiscount">حتى --% خصم</span>
      </div>
    </section>

    <div class="monthly-controls">
      <input class="monthly-search" id="monthlySearch" type="search" placeholder="ابحث داخل عروض الشهر..." data-i18n-placeholder="ابحث داخل عروض الشهر..." autocomplete="off">
    </div>

    <section class="monthly-grid" id="monthlyGrid" aria-live="polite"></section>
  </main>
