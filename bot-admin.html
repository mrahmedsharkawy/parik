<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مساعد بريق 🤖</title>

  <!-- ملف Supabase الموجود عندك -->
  <script src="java/supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6fa;
      color: #182846;
    }

    .header {
      background: #152546;
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
    }

    @media(max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #dce1ea;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      outline: none;
      background: #fafbfd;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #d4af37;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #152546;
      color: white;
    }

    .btn-gold {
      background: #d4af37;
      color: #152546;
    }

    .btn-danger {
      background: #ffe9e9;
      color: #c62828;
    }

    .btn-gray {
      background: #eef1f6;
      color: #152546;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .test-box {
      border: 1px solid #e1e5ec;
      border-radius: 12px;
      padding: 12px;
      height: 300px;
      overflow-y: auto;
      background: #fafbfd;
      margin-bottom: 10px;
    }

    .message {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .customer {
      background: #e9edf5;
    }

    .bot {
      background: #fff7d9;
      border: 1px solid #eadca0;
    }

    .item {
      border: 1px solid #e1e5ec;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      background: white;
    }

    .item.disabled {
      opacity: .55;
    }

    .question {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 7px;
    }

    .answer {
      color: #555;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .meta {
      margin-top: 9px;
      font-size: 12px;
      color: #7b8495;
    }

    .badge {
      display: inline-block;
      background: #eef1f6;
      border-radius: 20px;
      padding: 4px 8px;
      margin-left: 4px;
    }

    .active {
      background: #e4f7ea;
      color: #218644;
    }

    .inactive {
      background: #ffe9e9;
      color: #c62828;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
    }

    .success {
      color: #218644;
    }

    .error {
      color: #c62828;
    }

    .empty {
      text-align: center;
      color: #929aaa;
      padding: 30px;
    }
  </style>
</head>

<body>

<header class="header">
  <h1>🤖 مساعد بريق</h1>

  <button
    class="btn-gray"
    onclick="location.href='admin.html'">
    العودة للوحة التحكم
  </button>
</header>


<div class="container">

  <div class="grid">

    <!-- ===================== -->
    <!-- اختبار البوت -->
    <!-- ===================== -->

    <div>

      <div class="card">

        <h2>🧪 اختبار البوت</h2>

        <div
          id="chat"
          class="test-box">

          <div class="empty">
            اكتب سؤال عميل لتجربة البوت
          </div>

        </div>

        <div style="display:flex;gap:8px">

          <input
            id="testMessage"
            placeholder="مثال: بتوصلوا راس الخيمة؟"
            onkeydown="
              if(event.key === 'Enter') {
                testBot();
              }
            "
          >

          <button
            class="btn-gold"
            onclick="testBot()">

            إرسال

          </button>

        </div>

        <div id="testStatus" class="status"></div>

      </div>


      <!-- ===================== -->
      <!-- إضافة / تعديل -->
      <!-- ===================== -->

      <div class="card">

        <h2 id="formTitle">
          ➕ إضافة سؤال جديد
        </h2>


        <label>
          السؤال
        </label>

        <input
          id="question"
          placeholder="مثال: هل عندكم توصيل؟"
        >


        <label>
          الإجابة
        </label>

        <textarea
          id="answer"
          placeholder="اكتب الرد الذي سيقوله البوت للعميل">
        </textarea>


        <label>
          التصنيف
        </label>

        <input
          id="category"
          placeholder="التوصيل"
        >


        <label>
          الكلمات المرتبطة
        </label>

        <input
          id="keywords"
          placeholder="توصيل، دليفري، delivery"
        >


        <label style="margin-top:15px">

          <input
            type="checkbox"
            id="active"
            checked
            style="width:auto">

          السؤال فعال

        </label>


        <div class="buttons">

          <button
            id="saveButton"
            class="btn-gold"
            onclick="saveQuestion()">

            حفظ السؤال

          </button>


          <button
            class="btn-gray"
            onclick="resetForm()">

            إلغاء

          </button>

        </div>


        <div id="formStatus" class="status"></div>

      </div>

    </div>


    <!-- ===================== -->
    <!-- قاعدة المعرفة -->
    <!-- ===================== -->

    <div class="card">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        flex-wrap:wrap;
      ">

        <h2>
          📚 قاعدة معرفة البوت
        </h2>

        <button
          class="btn-primary"
          onclick="loadQuestions()">

          🔄 تحديث

        </button>

      </div>


      <input
        id="search"
        placeholder="🔍 ابحث عن سؤال أو إجابة..."
        oninput="renderQuestions()"
        style="margin-bottom:15px"
      >


      <div id="questions">

        <div class="empty">
          جاري تحميل الأسئلة...
        </div>

      </div>

    </div>

  </div>

</div>


<script>

let questions = [];

let editingId = null;


/* =====================================
   تحميل الأسئلة
===================================== */

async function loadQuestions() {

  try {

    const data = await sbFetch(
      "bot_knowledge?select=*&order=id.desc"
    );

    questions = data || [];

    renderQuestions();

  } catch(error) {

    document.getElementById("questions").innerHTML =
      `
      <div class="empty error">
        حدث خطأ أثناء تحميل قاعدة المعرفة
        <br>
        ${escapeHtml(error.message)}
      </div>
      `;

  }

}


/* =====================================
   عرض الأسئلة
===================================== */

function renderQuestions() {

  const container =
    document.getElementById("questions");

  const search =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    questions.filter(item => {

      const text =
        [
          item.question,
          item.answer,
          item.category,
          (item.keywords || []).join(" ")
        ]
        .join(" ")
        .toLowerCase();

      return !search || text.includes(search);

    });


  if(!filtered.length) {

    container.innerHTML =
      `
      <div class="empty">
        لا توجد نتائج
      </div>
      `;

    return;

  }


  container.innerHTML =
    filtered.map(item => {

      return `

      <div class="item ${item.active ? "" : "disabled"}">

        <div class="question">

          ${escapeHtml(item.question)}

        </div>


        <div class="answer">

          ${escapeHtml(item.answer)}

        </div>


        <div class="meta">

          <span class="badge">

            ${escapeHtml(item.category || "بدون تصنيف")}

          </span>


          <span class="badge ${
            item.active
              ? "active"
              : "inactive"
          }">

            ${
              item.active
                ? "فعال"
                : "متوقف"
            }

          </span>


          <span class="badge">

            استخدم ${item.usage_count || 0} مرة

          </span>

        </div>


        <div class="buttons">

          <button
            class="btn-gray"
            onclick="editQuestion(${item.id})">

            ✏️ تعديل

          </button>


          <button
            class="${
              item.active
                ? "btn-danger"
                : "btn-primary"
            }"
            onclick="
              toggleQuestion(
                ${item.id},
                ${item.active}
              )
            ">

            ${
              item.active
                ? "🔴 تعطيل"
                : "🟢 تفعيل"
            }

          </button>


          <button
            class="btn-danger"
            onclick="deleteQuestion(${item.id})">

            🗑️ حذف

          </button>

        </div>

      </div>

      `;

    }).join("");

}


/* =====================================
   إضافة / تعديل
===================================== */

async function saveQuestion() {

  const question =
    document.getElementById("question")
      .value
      .trim();

  const answer =
    document.getElementById("answer")
      .value
      .trim();

  const category =
    document.getElementById("category")
      .value
      .trim();

  const keywordsText =
    document.getElementById("keywords")
      .value
      .trim();

  const active =
    document.getElementById("active")
      .checked;


  if(!question || !answer) {

    showFormStatus(
      "اكتب السؤال والإجابة أولًا",
      false
    );

    return;

  }


  const keywords =
    keywordsText
      .split(/[,،]/)
      .map(x => x.trim())
      .filter(Boolean);


  const payload = {

    question,

    answer,

    category:
      category || null,

    keywords,

    active,

    updated_at:
      new Date().toISOString()

  };


  try {

    if(editingId) {

      await sbFetch(
        "bot_knowledge?id=eq." +
        editingId,
        {
          method: "PATCH",
          body: JSON.stringify(payload)
        }
      );


      showFormStatus(
        "تم تعديل السؤال بنجاح ✅",
        true
      );

    } else {

      await sbFetch(
        "bot_knowledge",
        {
          method: "POST",
          body: JSON.stringify(payload)
        }
      );


      showFormStatus(
        "تمت إضافة السؤال بنجاح ✅",
        true
      );

    }


    resetForm();

    await loadQuestions();

  } catch(error) {

    showFormStatus(
      "حدث خطأ: " + error.message,
      false
    );

  }

}


/* =====================================
   تعديل
===================================== */

function editQuestion(id) {

  const item =
    questions.find(
      x => x.id === id
    );

  if(!item) return;


  editingId = id;


  document.getElementById("question")
    .value =
    item.question || "";


  document.getElementById("answer")
    .value =
    item.answer || "";


  document.getElementById("category")
    .value =
    item.category || "";


  document.getElementById("keywords")
    .value =
    (item.keywords || []).join("، ");


  document.getElementById("active")
    .checked =
    !!item.active;


  document.getElementById("formTitle")
    .textContent =
    "✏️ تعديل السؤال";


  document.getElementById("saveButton")
    .textContent =
    "حفظ التعديل";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================
   إلغاء التعديل
===================================== */

function resetForm() {

  editingId = null;


  document.getElementById("question")
    .value = "";

  document.getElementById("answer")
    .value = "";

  document.getElementById("category")
    .value = "";

  document.getElementById("keywords")
    .value = "";

  document.getElementById("active")
    .checked = true;


  document.getElementById("formTitle")
    .textContent =
    "➕ إضافة سؤال جديد";


  document.getElementById("saveButton")
    .textContent =
    "حفظ السؤال";

}


/* =====================================
   تشغيل / تعطيل
===================================== */

async function toggleQuestion(id, active) {

  try {

    await sbFetch(
      "bot_knowledge?id=eq." + id,
      {
        method: "PATCH",

        body: JSON.stringify({

          active: !active,

          updated_at:
            new Date().toISOString()

        })

      }
    );


    await loadQuestions();

  } catch(error) {

    alert(
      "حدث خطأ: " +
      error.message
    );

  }

}


/* =====================================
   حذف
===================================== */

async function deleteQuestion(id) {

  if(
    !confirm(
      "هل أنت متأكد من حذف هذا السؤال؟"
    )
  ) return;


  try {

    await sbFetch(
      "bot_knowledge?id=eq." + id,
      {
        method: "DELETE",
        prefer: "return=minimal"
      }
    );


    await loadQuestions();

  } catch(error) {

    alert(
      "حدث خطأ: " +
      error.message
    );

  }

}


/* =====================================
   اختبار البوت
===================================== */

async function testBot() {

  const input =
    document.getElementById(
      "testMessage"
    );

  const message =
    input.value.trim();


  if(!message) return;


  const chat =
    document.getElementById("chat");


  if(
    chat.querySelector(".empty")
  ) {

    chat.innerHTML = "";

  }


  chat.insertAdjacentHTML(
    "beforeend",

    `
    <div class="message customer">

      👤 ${escapeHtml(message)}

    </div>
    `
  );


  input.value = "";


  showTestStatus(
    "جاري البحث عن الإجابة..."
  );


  try {

    /*
      البوت التجريبي الموجود في Supabase
    */

    const response =
      await fetch(
        "https://knleehjjejfeobcmpwnw.supabase.co/functions/v1/bot-test",
        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              getAuthToken()

          },

          body: JSON.stringify({
            message
          })

        }
      );


    const result =
      await response.json();


    if(!response.ok) {

      throw new Error(
        result.error ||
        "فشل اختبار البوت"
      );

    }


    let answer;


    if(result.found) {

      answer =
        result.answer;

    } else {

      answer =
        "مش لاقي إجابة مؤكدة للسؤال ده حاليًا 🤔\n\nممكن نحوله لموظف بريق.";

    }


    chat.insertAdjacentHTML(
      "beforeend",

      `
      <div class="message bot">

        🤖 ${escapeHtml(answer)}

        <div class="meta">

          ${
            result.found
              ? "السؤال المطابق: " +
                escapeHtml(
                  result.matched_question
                )
              : "لم يتم العثور على مطابقة مؤكدة"
          }

        </div>

      </div>
      `
    );


    chat.scrollTop =
      chat.scrollHeight;


    showTestStatus(
      "تم الاختبار بنجاح ✅",
      true
    );


  } catch(error) {

    showTestStatus(
      "خطأ: " + error.message,
      false
    );

  }

}


/* =====================================
   الحصول على التوكن
===================================== */

function getAuthToken() {

  try {

    const adminToken =
      sessionStorage.getItem(
        "admin_token"
      );

    if(adminToken)
      return adminToken;


    const userToken =
      localStorage.getItem(
        "x2_token"
      );

    if(userToken)
      return userToken;


  } catch(e) {}


  return "";

}


/* =====================================
   الرسائل
===================================== */

function showFormStatus(
  message,
  success
) {

  const el =
    document.getElementById(
      "formStatus"
    );

  el.textContent =
    message;

  el.className =
    "status " +
    (
      success
        ? "success"
        : "error"
    );

}


function showTestStatus(
  message,
  success = false
) {

  const el =
    document.getElementById(
      "testStatus"
    );

  el.textContent =
    message;

  el.className =
    "status " +
    (
      success
        ? "success"
        : "error"
    );

}


/* =====================================
   حماية HTML
===================================== */

function escapeHtml(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,

    char => ({

      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"

    })[char]

  );

}


/* =====================================
   تشغيل الصفحة
===================================== */

loadQuestions();

</script>

</body>
</html>
