<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مساعد بريق 🤖</title>

  <!-- ملف Supabase الموجود في مشروع بريق -->
  <script src="java/supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6fa;
      color: #182846;
    }

    .header {
      background: #152546;
      color: #fff;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 15px;
      font-size: 18px;
      color: #152546;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #dce1ea;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      outline: none;
      background: #fafbfd;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #d4af37;
      background: #fff;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    button:active {
      transform: scale(.98);
    }

    .btn-primary {
      background: #152546;
      color: #fff;
    }

    .btn-gold {
      background: #d4af37;
      color: #152546;
    }

    .btn-danger {
      background: #ffe9e9;
      color: #c62828;
    }

    .btn-gray {
      background: #eef1f6;
      color: #152546;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .test-box {
      border: 1px solid #e1e5ec;
      border-radius: 12px;
      padding: 12px;
      height: 320px;
      overflow-y: auto;
      background: #fafbfd;
      margin-bottom: 10px;
    }

    .message {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .customer {
      background: #e9edf5;
    }

    .bot {
      background: #fff7d9;
      border: 1px solid #eadca0;
    }

    .item {
      border: 1px solid #e1e5ec;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fff;
    }

    .item.disabled {
      opacity: .55;
    }

    .question {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 7px;
      color: #152546;
    }

    .answer {
      color: #555;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .meta {
      margin-top: 9px;
      font-size: 12px;
      color: #7b8495;
    }

    .badge {
      display: inline-block;
      background: #eef1f6;
      border-radius: 20px;
      padding: 4px 8px;
      margin-left: 4px;
      margin-bottom: 4px;
    }

    .active {
      background: #e4f7ea;
      color: #218644;
    }

    .inactive {
      background: #ffe9e9;
      color: #c62828;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    .success {
      color: #218644;
    }

    .error {
      color: #c62828;
    }

    .empty {
      text-align: center;
      color: #929aaa;
      padding: 30px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .header {
        padding: 14px;
      }

      .header h1 {
        font-size: 16px;
      }

      .container {
        padding: 12px;
      }

      .card {
        padding: 15px;
      }
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      font-size: 14px;
    }

    .checkbox-row input {
      width: auto;
      margin: 0;
    }

    .test-input {
      display: flex;
      gap: 8px;
    }

    .test-input input {
      flex: 1;
    }

    .loading {
      opacity: .6;
      pointer-events: none;
    }
  </style>
</head>

<body>

<header class="header">

  <h1>
    🤖 مساعد بريق
  </h1>

  <button
    class="btn-gray"
    onclick="location.href='admin.html'">

    العودة للوحة التحكم

  </button>

</header>


<div class="container">

  <div class="grid">

    <!-- ========================================= -->
    <!-- العمود الأول -->
    <!-- ========================================= -->

    <div>

      <!-- اختبار البوت -->
      <div class="card">

        <h2>
          🧪 اختبار البوت
        </h2>

        <div
          id="chat"
          class="test-box">

          <div class="empty">
            اكتب سؤال عميل لتجربة البوت 👇
          </div>

        </div>


        <div class="test-input">

          <input
            id="testMessage"
            placeholder="مثال: بتوصلوا راس الخيمة؟"
            autocomplete="off"
          >

          <button
            id="testButton"
            class="btn-gold"
            onclick="testBot()">

            إرسال

          </button>

        </div>


        <div
          id="testStatus"
          class="status">
        </div>

      </div>


      <!-- إضافة / تعديل سؤال -->
      <div class="card">

        <h2 id="formTitle">
          ➕ إضافة سؤال جديد
        </h2>


        <label>
          السؤال
        </label>

        <input
          id="question"
          placeholder="مثال: هل عندكم توصيل؟"
        >


        <label>
          الإجابة
        </label>

        <textarea
          id="answer"
          placeholder="اكتب الرد الذي سيقوله البوت للعميل"></textarea>


        <div class="form-row">

          <div>

            <label>
              التصنيف
            </label>

            <input
              id="category"
              placeholder="التوصيل"
            >

          </div>


          <div>

            <label>
              الكلمات المرتبطة
            </label>

            <input
              id="keywords"
              placeholder="توصيل، دليفري، delivery"
            >

          </div>

        </div>


        <label class="checkbox-row">

          <input
            type="checkbox"
            id="active"
            checked
          >

          السؤال فعال ويستخدمه البوت

        </label>


        <div class="buttons">

          <button
            id="saveButton"
            class="btn-gold"
            onclick="saveQuestion()">

            حفظ السؤال

          </button>


          <button
            class="btn-gray"
            onclick="resetForm()">

            إلغاء

          </button>

        </div>


        <div
          id="formStatus"
          class="status">
        </div>

      </div>

    </div>


    <!-- ========================================= -->
    <!-- قاعدة المعرفة -->
    <!-- ========================================= -->

    <div class="card">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:10px;
          flex-wrap:wrap;
        "
      >

        <h2 style="margin:0">
          📚 قاعدة معرفة البوت
        </h2>


        <button
          class="btn-primary"
          onclick="loadQuestions()">

          🔄 تحديث

        </button>

      </div>


      <div
        style="
          background:#f0f3f8;
          padding:10px;
          border-radius:10px;
          margin:15px 0;
          font-size:13px;
          color:#657087;
          line-height:1.6;
        "
      >

        أي سؤال تضيفه أو تعدله هنا يتم حفظه مباشرة في
        <b>Supabase</b>
        ويصبح متاحًا للبوت.

      </div>


      <input
        id="search"
        placeholder="🔍 ابحث عن سؤال أو إجابة أو تصنيف..."
        oninput="renderQuestions()"
        style="margin-bottom:15px"
      >


      <div id="questions">

        <div class="empty">
          جاري تحميل الأسئلة...
        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   متغيرات عامة
===================================================== */

let questions = [];

let editingId = null;


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, function(char) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[char];

    });

}


/* =====================================================
   حالة النموذج
===================================================== */

function showFormStatus(message, success = false) {

  const el =
    document.getElementById("formStatus");

  el.textContent = message;

  el.className =
    "status " +
    (
      success
        ? "success"
        : "error"
    );

}


function showTestStatus(message, success = false) {

  const el =
    document.getElementById("testStatus");

  el.textContent = message;

  el.className =
    "status " +
    (
      success
        ? "success"
        : "error"
    );

}


/* =====================================================
   تحميل قاعدة المعرفة
===================================================== */

async function loadQuestions() {

  const container =
    document.getElementById("questions");

  container.innerHTML = `
    <div class="empty">
      جاري تحميل الأسئلة...
    </div>
  `;


  try {

    const data =
      await sbFetch(
        "bot_knowledge?select=*&order=id.desc"
      );


    questions =
      Array.isArray(data)
        ? data
        : [];


    renderQuestions();


  } catch(error) {

    console.error(
      "LOAD KNOWLEDGE ERROR:",
      error
    );


    container.innerHTML = `
      <div class="empty error">

        حدث خطأ أثناء تحميل قاعدة المعرفة

        <br><br>

        ${escapeHtml(error.message)}

      </div>
    `;

  }

}


/* =====================================================
   عرض الأسئلة
===================================================== */

function renderQuestions() {

  const container =
    document.getElementById("questions");


  const search =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    questions.filter(function(item) {

      const keywords =
        Array.isArray(item.keywords)
          ? item.keywords.join(" ")
          : "";


      const text =
        [
          item.question,
          item.answer,
          item.category,
          keywords
        ]
        .join(" ")
        .toLowerCase();


      return (
        !search ||
        text.includes(search)
      );

    });


  if(!filtered.length) {

    container.innerHTML = `
      <div class="empty">
        لا توجد نتائج
      </div>
    `;

    return;

  }


  container.innerHTML =
    filtered
      .map(function(item) {

        const keywords =
          Array.isArray(item.keywords)
            ? item.keywords
            : [];


        return `

          <div
            class="item ${
              item.active
                ? ""
                : "disabled"
            }"
          >

            <div class="question">

              ${escapeHtml(
                item.question
              )}

            </div>


            <div class="answer">

              ${escapeHtml(
                item.answer
              )}

            </div>


            <div class="meta">

              <span class="badge">

                ${escapeHtml(
                  item.category ||
                  "بدون تصنيف"
                )}

              </span>


              <span
                class="badge ${
                  item.active
                    ? "active"
                    : "inactive"
                }"
              >

                ${
                  item.active
                    ? "فعال"
                    : "متوقف"
                }

              </span>


              <span class="badge">

                استخدم
                ${Number(
                  item.usage_count || 0
                )}
                مرة

              </span>


              ${
                keywords.length

                  ? `
                    <span class="badge">

                      ${escapeHtml(
                        keywords.join("، ")
                      )}

                    </span>
                  `

                  : ""
              }

            </div>


            <div class="buttons">

              <button
                class="btn-gray"
                onclick="
                  editQuestion(
                    ${item.id}
                  )
                "
              >

                ✏️ تعديل

              </button>


              <button
                class="${
                  item.active
                    ? "btn-danger"
                    : "btn-primary"
                }"
                onclick="
                  toggleQuestion(
                    ${item.id},
                    ${!!item.active}
                  )
                "
              >

                ${
                  item.active
                    ? "🔴 تعطيل"
                    : "🟢 تفعيل"
                }

              </button>


              <button
                class="btn-danger"
                onclick="
                  deleteQuestion(
                    ${item.id}
                  )
                "
              >

                🗑️ حذف

              </button>

            </div>

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   تعديل سؤال
===================================================== */

function editQuestion(id) {

  const item =
    questions.find(
      function(x) {
        return x.id === id;
      }
    );


  if(!item) return;


  editingId = id;


  document.getElementById("question")
    .value =
    item.question || "";


  document.getElementById("answer")
    .value =
    item.answer || "";


  document.getElementById("category")
    .value =
    item.category || "";


  document.getElementById("keywords")
    .value =
    Array.isArray(item.keywords)
      ? item.keywords.join("، ")
      : "";


  document.getElementById("active")
    .checked =
    !!item.active;


  document.getElementById("formTitle")
    .textContent =
    "✏️ تعديل السؤال";


  document.getElementById("saveButton")
    .textContent =
    "حفظ التعديل";


  document.getElementById("formStatus")
    .textContent =
    "";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   إعادة النموذج
===================================================== */

function resetForm() {

  editingId = null;


  document.getElementById("question")
    .value = "";


  document.getElementById("answer")
    .value = "";


  document.getElementById("category")
    .value = "";


  document.getElementById("keywords")
    .value = "";


  document.getElementById("active")
    .checked = true;


  document.getElementById("formTitle")
    .textContent =
    "➕ إضافة سؤال جديد";


  document.getElementById("saveButton")
    .textContent =
    "حفظ السؤال";


  document.getElementById("formStatus")
    .textContent =
    "";

}


/* =====================================================
   تحويل الكلمات إلى Array
===================================================== */

function getKeywords(text) {

  return String(text || "")
    .split(/[,،]/)
    .map(function(item) {
      return item.trim();
    })
    .filter(Boolean);

}


/* =====================================================
   حفظ سؤال
===================================================== */

async function saveQuestion() {

  const question =
    document.getElementById("question")
      .value
      .trim();


  const answer =
    document.getElementById("answer")
      .value
      .trim();


  const category =
    document.getElementById("category")
      .value
      .trim();


  const keywords =
    getKeywords(
      document.getElementById("keywords")
        .value
    );


  const active =
    document.getElementById("active")
      .checked;


  if(!question) {

    showFormStatus(
      "اكتب السؤال أولًا."
    );

    return;

  }


  if(!answer) {

    showFormStatus(
      "اكتب الإجابة أولًا."
    );

    return;

  }


  const payload = {

    question,

    answer,

    category:
      category || null,

    keywords,

    active,

    updated_at:
      new Date().toISOString()

  };


  try {

    if(editingId) {

      await sbFetch(
        "bot_knowledge?id=eq." +
        editingId,
        {
          method: "PATCH",
          body:
            JSON.stringify(payload)
        }
      );


      showFormStatus(
        "تم تعديل السؤال بنجاح ✅",
        true
      );


    } else {

      await sbFetch(
        "bot_knowledge",
        {
          method: "POST",
          body:
            JSON.stringify(payload)
        }
      );


      showFormStatus(
        "تمت إضافة السؤال بنجاح ✅",
        true
      );

    }


    await loadQuestions();


    setTimeout(
      resetForm,
      700
    );


  } catch(error) {

    console.error(
      "SAVE ERROR:",
      error
    );


    showFormStatus(
      "فشل الحفظ: " +
      error.message
    );

  }

}


/* =====================================================
   تشغيل / تعطيل
===================================================== */

async function toggleQuestion(
  id,
  currentActive
) {

  try {

    await sbFetch(
      "bot_knowledge?id=eq." +
      id,
      {
        method: "PATCH",

        body:
          JSON.stringify({

            active:
              !currentActive,

            updated_at:
              new Date().toISOString()

          })

      }
    );


    await loadQuestions();


  } catch(error) {

    console.error(
      "TOGGLE ERROR:",
      error
    );


    alert(
      "حدث خطأ:\n" +
      error.message
    );

  }

}


/* =====================================================
   حذف
===================================================== */

async function deleteQuestion(id) {

  const confirmed =
    confirm(
      "هل أنت متأكد من حذف السؤال؟\n\n" +
      "لا يمكن التراجع عن الحذف."
    );


  if(!confirmed) return;


  try {

    await sbFetch(
      "bot_knowledge?id=eq." +
      id,
      {
        method: "DELETE",

        headers: {
          "Prefer":
            "return=minimal"
        }

      }
    );


    await loadQuestions();


  } catch(error) {

    console.error(
      "DELETE ERROR:",
      error
    );


    alert(
      "حدث خطأ أثناء الحذف:\n" +
      error.message
    );

  }

}


/* =====================================================
   تطبيع النص العربي
===================================================== */

function normalizeArabic(text) {

  return String(text || "")
    .toLowerCase()

    .replace(/[إأآا]/g, "ا")

    .replace(/ة/g, "ه")

    .replace(/ى/g, "ي")

    .replace(
      /[ًٌٍَُِّْـ]/g,
      ""
    )

    .replace(
      /[^\u0600-\u06FFa-zA-Z0-9\s]/g,
      " "
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


/* =====================================================
   حساب تطابق السؤال
===================================================== */

function calculateScore(
  message,
  item
) {

  const text =
    normalizeArabic(message);


  const words =
    new Set(
      text
        .split(" ")
        .filter(Boolean)
    );


  let score = 0;


  /*
    كلمات السؤال
  */

  const questionWords =
    normalizeArabic(
      item.question
    )
      .split(" ")
      .filter(function(word) {

        return word.length > 2;

      });


  questionWords.forEach(
    function(word) {

      if(words.has(word)) {

        score += 2;

      }

    }
  );


  /*
    الكلمات المرتبطة
  */

  const keywords =
    Array.isArray(item.keywords)
      ? item.keywords
      : [];


  keywords.forEach(
    function(keyword) {

      const key =
        normalizeArabic(
          keyword
        );


      if(
        key &&
        text.includes(key)
      ) {

        score += 4;

      }

    }
  );


  /*
    تطابق السؤال كاملًا
  */

  const normalizedQuestion =
    normalizeArabic(
      item.question
    );


  if(
    normalizedQuestion &&
    text.includes(
      normalizedQuestion
    )
  ) {

    score += 5;

  }


  return score;

}


/* =====================================================
   اختبار البوت
===================================================== */

async function testBot() {

  const input =
    document.getElementById(
      "testMessage"
    );


  const message =
    input.value.trim();


  if(!message) {

    showTestStatus(
      "اكتب سؤال أولًا."
    );

    return;

  }


  const button =
    document.getElementById(
      "testButton"
    );


  const chat =
    document.getElementById(
      "chat"
    );


  /*
    إزالة رسالة البداية
  */

  const empty =
    chat.querySelector(
      ".empty"
    );


  if(empty) {

    empty.remove();

  }


  /*
    إضافة رسالة العميل
  */

  chat.insertAdjacentHTML(
    "beforeend",

    `
      <div class="message customer">

        👤 ${escapeHtml(message)}

      </div>
    `
  );


  input.value = "";


  button.disabled = true;

  button.textContent =
    "جاري البحث...";


  showTestStatus(
    "جاري البحث في قاعدة معرفة البوت...",
    true
  );


  try {

    /*
      قراءة الأسئلة الفعالة من Supabase
    */

    const data =
      await sbFetch(
        "bot_knowledge?select=id,question,answer,keywords,category,active,usage_count&active=eq.true"
      );


    if(!Array.isArray(data)) {

      throw new Error(
        "لم يتم تحميل قاعدة معرفة البوت."
      );

    }


    /*
      حساب التطابق
    */

    const ranked =
      data
        .map(function(item) {

          return {

            ...item,

            score:
              calculateScore(
                message,
                item
              )

          };

        })

        .filter(function(item) {

          return item.score > 0;

        })

        .sort(
          function(a, b) {

            return b.score - a.score;

          }
        );


    const best =
      ranked[0];


    /*
      الحد الأدنى للثقة
    */

    const confident =
      best &&
      best.score >= 4;


    let answer;


    if(confident) {

      answer =
        best.answer;


      /*
        زيادة عداد الاستخدام
      */

      try {

        await sbFetch(
          "bot_knowledge?id=eq." +
          best.id,
          {
            method: "PATCH",

            body:
              JSON.stringify({

                usage_count:
                  Number(
                    best.usage_count || 0
                  ) + 1

              })

          }
        );

      } catch(counterError) {

        console.warn(
          "Usage counter error:",
          counterError
        );

      }

    } else {

      answer =
        "مش لاقي إجابة مؤكدة للسؤال ده حاليًا 🤔\n\n" +
        "ممكن نحوله لموظف بريق.";

    }


    /*
      عرض رد البوت
    */

    chat.insertAdjacentHTML(
      "beforeend",

      `
        <div class="message bot">

          🤖 ${escapeHtml(answer)}

          <div class="meta">

            ${
              confident

                ? `
                  السؤال المطابق:
                  <b>
                    ${escapeHtml(
                      best.question
                    )}
                  </b>

                  <br>

                  درجة المطابقة:
                  ${best.score}

                  ${
                    best.category
                      ? `
                        <br>
                        التصنيف:
                        ${escapeHtml(
                          best.category
                        )}
                      `
                      : ""
                  }
                `

                : `
                  لم يتم العثور على مطابقة مؤكدة.
                  <br>
                  يمكن إضافة هذا السؤال إلى قاعدة المعرفة.
                `
            }

          </div>

        </div>
      `
    );


    chat.scrollTop =
      chat.scrollHeight;


    showTestStatus(
      confident
        ? "تم العثور على إجابة ✅"
        : "لم يتم العثور على إجابة مؤكدة ⚠️",
      confident
    );


  } catch(error) {

    console.error(
      "BOT TEST ERROR:",
      error
    );


    chat.insertAdjacentHTML(
      "beforeend",

      `
        <div class="message bot">

          ❌ حصل خطأ أثناء اختبار البوت.

          <div class="meta">

            ${escapeHtml(
              error.message
            )}

          </div>

        </div>
      `
    );


    showTestStatus(
      "فشل اختبار البوت: " +
      error.message
    );


  } finally {

    button.disabled = false;

    button.textContent =
      "إرسال";

  }

}


/* =====================================================
   Enter لإرسال السؤال
===================================================== */

document
  .getElementById(
    "testMessage"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if(
        event.key === "Enter"
      ) {

        event.preventDefault();

        testBot();

      }

    }
  );


/* =====================================================
   تحميل الصفحة
===================================================== */

loadQuestions();

</script>
