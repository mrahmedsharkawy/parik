  <style>
    /* === override main === */
    body { background: #f4f5f702; }
    #main.main {
      width: 100% !important;
      max-width: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      margin: 0 !important;
      padding: 80px 16px 40px !important;
      min-height: 100vh !important;
      box-sizing: border-box !important;
    }

    /* === بطاقة الدخول === */
    .auth-card {
      background: #fff;
      border-radius: 20px;
      border: 1px solid #eee;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 460px;
      overflow: hidden;
    }

    /* الشعار */
    .auth-logo {
      text-align: center;
      padding: 28px 24px 0;
    }
    .auth-logo img { height: 40px; }
    .auth-logo h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #111;
      margin: 12px 0 4px;
    }
    .auth-logo p { font-size: 0.85rem; color: #888; margin: 0 0 20px; }

    /* التبويبات */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #f0f0f0;
    }
    .auth-tab {
      padding: 14px;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 700;
      color: #888;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .auth-tab.active { color: #D4AF37; border-bottom-color: #D4AF37; background: rgba(21,37,70,0.07); }

    /* النماذج */
    .auth-form { padding: 24px; display: none; }
    .auth-form.active { display: block; }

    .auth-input-group { margin-bottom: 16px; }
    .auth-input-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #444;
      margin-bottom: 6px;
    }
    .auth-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .auth-input-wrap input {
      width: 100%;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      padding: 11px 14px 11px 42px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
      box-sizing: border-box;
      color: #222;
    }
    .auth-input-wrap input:focus { border-color: #D4AF37; }
    .auth-input-wrap .input-ico {
      position: absolute;
      left: 14px;
      font-size: 1rem;
      color: #bbb;
      pointer-events: none;
    }
    .auth-input-wrap .toggle-pass {
      position: absolute;
      right: 12px;
      font-size: 0.85rem;
      color: #aaa;
      cursor: pointer;
      padding: 4px;
    }
    .auth-input-wrap input:focus + .toggle-pass,
    .auth-input-wrap .toggle-pass:hover { color: #D4AF37; }

    /* خطأ */
    .auth-error {
      background: #fff0f0;
      color: #c62828;
      border: 1px solid #ffcdd2;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.82rem;
      margin-bottom: 14px;
      display: none;
    }

    /* الزر الرئيسي */
    .auth-btn {
      width: 100%;
      background: linear-gradient(135deg, #152546, #0d1c38);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 4px;
    }
    .auth-btn:hover { opacity: 0.93; }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* نسيت كلمة المرور */
    .auth-forgot {
      text-align: left;
      margin-bottom: 14px;
    }
    .auth-forgot a {
      font-size: 0.8rem;
      color: #D4AF37;
      text-decoration: none;
      font-weight: 600;
    }

    /* فاصل */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: #ccc;
      font-size: 0.8rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #eee;
    }

    /* تسجيل بالشبكات الاجتماعية */
    .auth-social { display: flex; justify-content: center; gap: 10px; margin-bottom: 4px; }
    .auth-social-btn {
      flex: 0 1 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      background: #fff;
      transition: border-color 0.15s, background 0.15s;
    }
    .auth-social-btn:hover { border-color: #D4AF37; background: rgba(21,37,70,0.07); }
    .auth-social-btn img { width: 18px; height: 18px; }
    .auth-social-btn.google-btn {
      border-color: #dadce0;
      background: linear-gradient(135deg, #4285F4 0%, #6a5cff 48%, #EA4335 100%);
      color: #fff;
      box-shadow: 0 8px 18px rgba(66,133,244,.18);
    }
    .auth-social-btn.google-btn:hover { border-color: #c9ccd1; filter: brightness(.98); background: linear-gradient(135deg, #4285F4 0%, #6a5cff 48%, #EA4335 100%); }
    .google-mark { width:22px;height:22px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;letter-spacing:0;color:#4285F4;box-shadow:0 1px 4px rgba(0,0,0,.16);font-family:Arial,sans-serif; }

    /* قوة كلمة المرور */
    .strength-bar {
      height: 4px;
      border-radius: 4px;
      background: #eee;
      margin-top: 6px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.3s, background 0.3s;
    }
    .strength-label { font-size: 0.72rem; color: #888; margin-top: 3px; }

    /* موافقة الشروط */
    .auth-terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.78rem;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .auth-terms input[type="checkbox"] {
      accent-color: #D4AF37;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .auth-terms a { color: #D4AF37; text-decoration: none; }

    /* footer */
    .auth-footer {
      text-align: center;
      padding: 16px 24px 20px;
      font-size: 0.82rem;
      color: #888;
      border-top: 1px solid #f5f5f5;
    }
    .auth-footer a { color: #D4AF37; font-weight: 600; text-decoration: none; }

    /* نجاح */
    .auth-success {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }
    .auth-success .s-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .auth-success h3 { font-size: 1.1rem; font-weight: 700; color: #111; margin-bottom: 8px; }
    .auth-success p { font-size: 0.85rem; color: #888; margin-bottom: 20px; }

    .profile-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(13,28,56,.58);
    }
    .profile-modal.active { display: flex; }
    .profile-modal-card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.22);
    }
    .profile-modal-card h3 { margin: 0 0 8px; color: #111; font-size: 1.12rem; }
    .profile-modal-card p { margin: 0 0 18px; color: #666; font-size: .86rem; line-height: 1.7; }

    /* موبايل */
    @media (max-width: 480px) {
      .auth-card { border-radius: 16px; }
      .auth-social { flex-direction: column; align-items: center; }
      .auth-social-btn { width: min(250px, 100%); flex-basis: auto; }
    }
  </style>
</head>
<body>

<div class="page">

  <header class="main-header" style="background:#152546;padding:10px 0">
    <div class="login-header-content" style="max-width:1400px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between">
      <a href="index.html" class="login-logo"><img src="/assets/logo.png" alt="Bariq Logo" style="height:34px"><span class="logo-text">Bariq</span></a>
      <div class="search-container login-mobile-search">
        <input type="text" id="loginMobileSearch" placeholder="ابحث في بريق..." autocomplete="off">
      </div>
      <span class="icon search-icon login-mobile-icon" style="cursor:pointer;display:none;align-items:center;" data-login-mobile-search>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <label class="icon camera-icon login-mobile-icon" for="loginImageSearchInput" style="cursor:pointer;display:none;align-items:center;margin-right:0;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </label>
      <input type="file" id="loginImageSearchInput" accept="image/*" style="display:none;">
      <a href="index.html" class="login-back-link" style="color:#fff;font-size:0.85rem;text-decoration:none;display:flex;align-items:center;gap:6px">
        ← العودة للمتجر
      </a>
    </div>
  </header>

  <main class="main" id="main">

    <div class="auth-card">

      <div class="auth-logo">
        <img src="/assets/logo.png" alt="Bariq Logo">
        <h2>مرحباً بك</h2>
        <p>سجّل دخولك أو أنشئ حساباً جديداً</p>
      </div>

      <!-- التبويبات -->
      <div class="auth-tabs">
        <div class="auth-tab active" data-auth-tab="login">🔑 تسجيل الدخول</div>
        <div class="auth-tab" data-auth-tab="register">📝 إنشاء حساب</div>
      </div>

      <!-- ===== نموذج تسجيل الدخول ===== -->
      <div class="auth-form active" id="form-login">

        <div class="auth-error" id="login-error"></div>

        <div class="auth-input-group">
          <label>البريد الإلكتروني أو رقم الهاتف</label>
          <div class="auth-input-wrap">
            <input type="text" id="login-email" placeholder="example@email.com" autocomplete="email">
            <span class="input-ico">📧</span>
          </div>
        </div>

        <div class="auth-input-group">
          <label>كلمة المرور</label>
          <div class="auth-input-wrap">
            <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
            <span class="input-ico">🔒</span>
            <span class="toggle-pass" data-toggle-pass="login-pass">👁</span>
          </div>
        </div>

        <div class="auth-forgot">
          <a href="#" data-show-forgot>نسيت كلمة المرور؟</a>
        </div>

        <button class="auth-btn" data-do-login>تسجيل الدخول</button>

        <div class="auth-social" style="margin-top:12px">
          <button type="button" class="auth-social-btn google-btn" data-social-provider="google" data-social-mode="login">
            <span class="google-mark" aria-hidden="true">G</span>
            <span>الدخول بحساب Google</span>
          </button>
        </div>
      </div>

      <!-- ===== نموذج إنشاء الحساب ===== -->
      <div class="auth-form" id="form-register">

        <div class="auth-error" id="register-error"></div>

        <div class="auth-input-group">
          <label>الاسم</label>
          <div class="auth-input-wrap">
            <input type="text" id="reg-fname" placeholder="الاسم الكامل">
            <span class="input-ico">👤</span>
          </div>
        </div>

        <div class="auth-input-group">
          <label>العنوان</label>
          <div class="auth-input-wrap">
            <input type="text" id="reg-address" placeholder="أدخل عنوانك">
            <span class="input-ico">📍</span>
          </div>
        </div>

        <div class="auth-input-group" style="margin-top:16px">
          <label>البريد الإلكتروني</label>
          <div class="auth-input-wrap">
            <input type="email" id="reg-email" placeholder="example@email.com" autocomplete="email">
            <span class="input-ico">📧</span>
          </div>
        </div>

        <div class="auth-input-group">
          <label>رقم الهاتف</label>
          <div class="auth-input-wrap">
            <input type="tel" id="reg-phone" value="+971 " placeholder="+971 XX XXX XXXX" inputmode="tel" dir="ltr" autocomplete="tel">
            <span class="input-ico">📱</span>
          </div>
        </div>

        <div class="auth-input-group">
          <label>كلمة المرور</label>
          <div class="auth-input-wrap">
            <input type="password" id="reg-pass" placeholder="8 أحرف على الأقل" autocomplete="new-password" data-strength-input>
            <span class="input-ico">🔒</span>
            <span class="toggle-pass" data-toggle-pass="reg-pass">👁</span>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <div class="strength-label" id="strength-label"></div>
        </div>

        <div class="auth-terms">
          <input type="checkbox" id="reg-terms">
          <label for="reg-terms">
            أوافق على <a href="policy.html">شروط الاستخدام</a> و<a href="policy.html">سياسة الخصوصية</a> الخاصة بـ Bariq
          </label>
        </div>

        <button class="auth-btn" data-do-register>إنشاء حساب جديد</button>

        <div class="auth-social" style="margin-top:12px">
          <button type="button" class="auth-social-btn google-btn" data-social-provider="google" data-social-mode="signup">
            <span class="google-mark" aria-hidden="true">G</span>
            <span>التسجيل بحساب Google</span>
          </button>
        </div>
      </div>

      <!-- نجاح -->
      <div class="auth-success" id="auth-success">
        <div class="s-icon">🎉</div>
        <h3 id="success-title">تم تسجيل الدخول بنجاح!</h3>
        <p id="success-msg">جارٍ تحويلك...</p>
        <button class="auth-btn" style="max-width:200px;margin:0 auto" data-go-account>
          الذهاب لحسابي
        </button>
      </div>

      <div class="auth-footer">
        <a href="index.html">← العودة للمتجر</a>
      </div>

    </div><!-- end auth-card -->

  </main>

  <div class="profile-modal" id="google-profile-modal" role="dialog" aria-modal="true" aria-labelledby="google-profile-title">
    <div class="profile-modal-card">
      <h3 id="google-profile-title">استكمال بيانات الحساب</h3>
      <p>أضف رقم الهاتف والعنوان لتأكيد حسابك الجديد في Bariq.</p>
      <div class="auth-error" id="google-profile-error"></div>
      <div class="auth-input-group">
        <label>رقم الهاتف</label>
        <div class="auth-input-wrap">
          <input type="tel" id="google-profile-phone" value="+971 " placeholder="+971 XX XXX XXXX" inputmode="tel" dir="ltr" autocomplete="tel">
          <span class="input-ico">📱</span>
        </div>
      </div>
      <div class="auth-input-group">
        <label>العنوان</label>
        <div class="auth-input-wrap">
          <input type="text" id="google-profile-address" placeholder="أدخل عنوانك" autocomplete="street-address">
          <span class="input-ico">📍</span>
        </div>
      </div>
      <button type="button" class="auth-btn" id="google-profile-save" data-complete-google-profile>حفظ ومتابعة</button>
    </div>
  </div>

  <script src="/java/main.js" defer></script>
  <script src="/translations/translation.js?v=translation-20260726c" defer></script>
  <script src="/java/login.js?v=20260803a"></script>

<script src="/java/supabase.js" defer></script>
</div><!-- end page -->
